server:
  port: 8080

spring:
  application:
    name: data-integration-backend
  config:
    import: optional:file:.env[.properties]

app:
  data-mode: ${APP_DATA_MODE:mock}
  databases:
    A:
      dbms: SQL Server
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      url: ${COLLEGE_A_JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=college_a;encrypt=true;trustServerCertificate=true}
      username: ${COLLEGE_A_DB_USER:sa}
      password: ${COLLEGE_A_DB_PASSWORD:ChangeMe_123}
    B:
      dbms: Oracle
      driver-class-name: oracle.jdbc.OracleDriver
      url: ${COLLEGE_B_JDBC_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
      username: ${COLLEGE_B_DB_USER:college_b}
      password: ${COLLEGE_B_DB_PASSWORD:ChangeMe_123}
    C:
      dbms: MySQL
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: ${COLLEGE_C_JDBC_URL:jdbc:mysql://localhost:3306/college_c?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
      username: ${COLLEGE_C_DB_USER:college_c}
      password: ${COLLEGE_C_DB_PASSWORD:ChangeMe_123}
